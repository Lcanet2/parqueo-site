<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source de og-image.png (1200×630). Régénérer : ouvrir ce fichier dans
       Chromium depuis la racine du site (la police est lue dans fonts/) et
       en faire une capture à 1200×630. -->
  <style>
    @font-face { font-family: 'Overpass'; src: url(fonts/overpass.woff2) format('woff2'); font-weight: 100 900; }
    text { font-family: 'Overpass', system-ui, sans-serif; }
  </style>
  <rect width="1200" height="630" fill="#ffffff"/>
  <!-- La panse du P, à l'échelle d'un panneau, rognée par le cadre. -->
  <path d="M640 -60 H930 A370 370 0 0 1 930 680 H640 Z" fill="#1a4bc4"/>
  <g transform="translate(72 92)">
    <path d="M0 0h24a20 20 0 0 1 0 40H0z" fill="#1a4bc4" transform="scale(.9)"/>
    <rect x="0" y="0" width="8" height="64" fill="#0f1115"/>
    <text fill="#0f1115" x="30" y="52" font-size="58" font-weight="800" letter-spacing="-1.7">arqueo</text>
  </g>
  <text fill="#0f1115" x="72" y="330" font-size="92" font-weight="800" letter-spacing="-3.2">Tickets, parc,</text>
  <text fill="#0f1115" x="72" y="418" font-size="92" font-weight="800" letter-spacing="-3.2">workflows.</text>
  <text x="72" y="500" font-size="30" font-weight="500" fill="#555b68">L'ITSM libre, installé sur votre serveur.</text>
  <text x="72" y="544" font-size="30" font-weight="500" fill="#555b68">parqueo.fr</text>
</svg>
