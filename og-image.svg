<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.3" fill="#dadae1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#f6f6f8"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Bloc-marque : le symbole tient lieu de P, « arqueo » suit en Archivo -->
  <g transform="translate(62.27 68.93) scale(1.6222)">
    <path d="M7 3h6a5 5 0 0 1 0 10H7z" fill="#d9435f"/>
    <path d="M7 4v16" stroke="#15151b" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <text x="93.3" y="103" font-family="Archivo SemiBold" font-size="40" letter-spacing="-1" fill="#15151b">arqueo</text>

  <text x="72" y="231" font-family="IBM Plex Mono Medium" font-size="15" letter-spacing="2.4" fill="#93939f">LOGICIEL ITSM AUTO-HÉBERGÉ</text>

  <text x="72" y="312" font-family="Archivo SemiBold" font-size="68" letter-spacing="-1.7" fill="#15151b">Le helpdesk et la gestion</text>
  <text x="72" y="390" font-family="Archivo SemiBold" font-size="68" letter-spacing="-1.7" fill="#15151b">de parc, <tspan fill="#d9435f">sans l'usine à gaz.</tspan></text>

  <text x="72" y="452" font-family="Inter" font-size="27" fill="#5d5d69">Ticketing · Inventaire · Catalogue de demandes · Workflows visuels</text>

  <!-- Connecteurs pointillés entre les blocs -->
  <g stroke="#c9c9d3" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round">
    <line x1="258" y1="550" x2="298" y2="550"/>
    <line x1="484" y1="550" x2="524" y2="550"/>
    <line x1="710" y1="550" x2="750" y2="550"/>
  </g>

  <!-- Bloc 1 — déclencheur -->
  <g>
    <rect x="72" y="517" width="186" height="66" rx="11" fill="#ffffff" stroke="#e3e3e9" stroke-width="1.5"/>
    <rect x="86" y="537" width="26" height="26" rx="7" fill="#fdf0f2"/>
    <path d="M100 543l-4.5 6h4l-.5 4.5 4.5-6h-4z" fill="#d9435f"/>
    <text x="122" y="546" font-family="IBM Plex Mono Medium" font-size="9" letter-spacing="1.1" fill="#93939f">DÉCLENCHEUR</text>
    <text x="122" y="566" font-family="Inter" font-size="14" fill="#15151b">Ticket créé</text>
  </g>

  <!-- Bloc 2 — action -->
  <g>
    <rect x="298" y="517" width="186" height="66" rx="11" fill="#ffffff" stroke="#e3e3e9" stroke-width="1.5"/>
    <rect x="312" y="537" width="26" height="26" rx="7" fill="#edf2fc"/>
    <circle cx="325" cy="546" r="3.2" fill="none" stroke="#3467d6" stroke-width="1.8"/>
    <path d="M319.5 555.5a5.5 5.5 0 0 1 11 0" fill="none" stroke="#3467d6" stroke-width="1.8" stroke-linecap="round"/>
    <text x="348" y="546" font-family="IBM Plex Mono Medium" font-size="9" letter-spacing="1.1" fill="#93939f">ACTION</text>
    <text x="348" y="566" font-family="Inter" font-size="14" fill="#15151b">Affecter l'équipe</text>
  </g>

  <!-- Bloc 3 — attente -->
  <g>
    <rect x="524" y="517" width="186" height="66" rx="11" fill="#ffffff" stroke="#e3e3e9" stroke-width="1.5"/>
    <rect x="538" y="537" width="26" height="26" rx="7" fill="#fdf3e5"/>
    <circle cx="551" cy="550" r="6.5" fill="none" stroke="#b25e09" stroke-width="1.8"/>
    <path d="M551 546.5V550l2.5 2" fill="none" stroke="#b25e09" stroke-width="1.8" stroke-linecap="round"/>
    <text x="574" y="546" font-family="IBM Plex Mono Medium" font-size="9" letter-spacing="1.1" fill="#93939f">ATTENTE</text>
    <text x="574" y="566" font-family="Inter" font-size="14" fill="#15151b">Prise en charge</text>
  </g>

  <!-- Bloc 4 — condition -->
  <g>
    <rect x="750" y="517" width="186" height="66" rx="11" fill="#ffffff" stroke="#e3e3e9" stroke-width="1.5"/>
    <rect x="764" y="537" width="26" height="26" rx="7" fill="#f3eefc"/>
    <path d="M772 543v6a3 3 0 0 0 3 3h6" fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M778.5 549l2.5 3-2.5 3" fill="none" stroke="#6d28d9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="800" y="546" font-family="IBM Plex Mono Medium" font-size="9" letter-spacing="1.1" fill="#93939f">CONDITION</text>
    <text x="800" y="566" font-family="Inter" font-size="14" fill="#15151b">Priorité haute ?</text>
  </g>
</svg>
